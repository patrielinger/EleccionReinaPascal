<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación</title>
    <link rel="stylesheet" href="css/style.css">
    <style id="categoryStyles"></style>
</head>
<body>

    <nav style="display: inline-block; width: 100%;">
    <h1>Eleccion Representante Blaise Pascal</h1>
    <button id="logout">Cerrar Sesión</button>
    </nav>

    <div id="votingStatusBanner" style="padding: 15px 20px; margin: 20px 0; border-radius: 8px; font-weight: bold; text-align: center; font-size: 16px; display: none;"></div>
    <div id="ranking"> 
        <h1>Mis votos</h1>
        <div id="rankingContent"></div>
    </div>
    <input type="text" id="search" placeholder="Buscar por nombre o número">
    <div id="candidatasGrid"></div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="candidataDetails"></div>
        </div>
    </div>
    <script>
        // Función para verificar que la sesión es válida
        async function verifySession() {
            let currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'index.html';
                return false;
            }
            
            try {
                const response = await fetch('/api/verify-session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: currentUser.username,
                        session_id: currentUser.session_id,
                        device_id: currentUser.device_id
                    })
                });
                
                const data = await response.json();
                
                if (!data.valid) {
                    // Sesión inválida - otro dispositivo está usando esta cuenta
                    localStorage.removeItem('currentUser');
                    alert('⚠️ Sesión expirada: Tu usuario está conectado desde otro dispositivo');
                    window.location.href = 'index.html';
                    return false;
                }
                return true;
            } catch (error) {
                // Si el servidor no responde, asumir que es válido (fallback)
                console.log('Verificación de sesión: modo fallback');
                return true;
            }
        }
        
        // Verificar sesión al cargar
        verifySession().then(valid => {
            if (valid) {
                initVoting();
            }
        });
        
        // Variables globales
        let currentUser;
        let candidatas = [];
        let votos = {};
        let categorias = [];
        let votingCategories = [];
        let votingMode = 'direct';
        let votingEnabled = true;
        let modal = null;
        const defaultCategorias = [
            { name: 'Reina', color: '#ff6fe7' },
            { name: 'Primera Princesa', color: '#e6fa33' },
            { name: 'Segunda Princesa', color: '#e6fa33' },
            { name: 'Primera Dama de Honor', color: '#1fff40' },
            { name: 'Segunda Dama de Honor', color: '#1fff40' }
        ];
        
        let pendingVotePayload = null;
        let pendingVoteRetryTimer = null;
        let dataPollingTimer = null;
        let isSavingVote = false;

        function clampScore(value) {
            const number = Number.parseInt(value, 10);
            if (Number.isNaN(number)) return 0;
            return Math.min(100, Math.max(1, number));
        }

        function normalizeScores(scores, categoryNames) {
            const normalized = {};
            if (!scores || typeof scores !== 'object') return normalized;
            Object.entries(scores).forEach(([category, score]) => {
                if (categoryNames.has(category)) {
                    normalized[category] = clampScore(score);
                }
            });
            return normalized;
        }

        function normalizeVotesData(rawVotos, categories) {
            const normalized = {};
            const categoryNames = new Set(categories.map(cat => cat.name));

            Object.entries(rawVotos || {}).forEach(([username, userVotes]) => {
                normalized[username] = {};
                if (!userVotes || typeof userVotes !== 'object') return;

                Object.entries(userVotes).forEach(([key, value]) => {
                    if (value && typeof value === 'object' && !Array.isArray(value) && 'scores' in value) {
                        normalized[username][key] = {
                            ...value,
                            scores: normalizeScores(value.scores, categoryNames)
                        };
                        return;
                    }

                    if (categoryNames.has(key) && (typeof value === 'number' || typeof value === 'string')) {
                        normalized[username][key] = value;
                    }
                });
            });

            return normalized;
        }

        function queueVotePayload(payload) {
            pendingVotePayload = payload;
            processPendingVote();
        }

        async function processPendingVote() {
            if (!pendingVotePayload || isSavingVote) return;
            isSavingVote = true;

            try {
                const response = await fetch('/api/save-votos', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(pendingVotePayload)
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        pendingVotePayload = null;
                        updateVotingStatusBanner('✅ Voto guardado en el servidor y persistido en votos.json', 'success');
                        return;
                    }
                    console.warn('Servidor rechazó el voto:', data);
                } else {
                    console.warn('Error HTTP guardando voto:', response.status, response.statusText);
                }
            } catch (error) {
                console.log('Error enviando voto al servidor:', error);
            } finally {
                isSavingVote = false;
                if (pendingVotePayload) {
                    startPendingVoteRetry();
                }
            }
        }

        function startPendingVoteRetry() {
            if (pendingVoteRetryTimer) return;
            pendingVoteRetryTimer = setInterval(() => {
                if (pendingVotePayload) {
                    processPendingVote();
                } else {
                    clearInterval(pendingVoteRetryTimer);
                    pendingVoteRetryTimer = null;
                }
            }, 2000);
        }

        function updateVotingStatusBanner(message, type) {
            const banner = document.getElementById('votingStatusBanner');
            banner.textContent = message;
            banner.style.display = 'block';
            if (type === 'error') {
                banner.style.backgroundColor = '#f8d7da';
                banner.style.color = '#721c24';
                banner.style.border = '2px solid #f5c6cb';
            } else if (type === 'success') {
                banner.style.backgroundColor = '#d4edda';
                banner.style.color = '#155724';
                banner.style.border = '2px solid #28a745';
            } else {
                banner.style.backgroundColor = '#fff3cd';
                banner.style.color = '#856404';
                banner.style.border = '2px solid #ffeeba';
            }
        }

        async function loadServerData() {
            try {
                const response = await fetch('/api/load-data', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                if (data.success) {
                    candidatas = data.candidatas || [];
                    const newVotingMode = data.voting_mode || 'direct';
                    
                    if (votingMode !== newVotingMode) {
                        votingMode = newVotingMode;
                        updateVotingModeUI();
                        updateVotingStatusBanner('⚠️ El sistema de votación ha cambiado. Recargando interfaz...', 'info');
                    } else {
                        votingMode = newVotingMode;
                    }
                    
                    if (votingMode === 'scoring') {
                        votingCategories = normalizeCategories(data.voting_categories || []);
                        categorias = normalizeCategories(data.categorias || []);
                        votos = normalizeVotesData(data.votos || {}, votingCategories);
                    } else {
                        categorias = normalizeCategories(data.categorias || []);
                        votingCategories = [];
                        votos = normalizeVotesData(data.votos || {}, categorias);
                    }
                    
                    if (pendingVotePayload && pendingVotePayload.username === currentUser.username) {
                        votos[currentUser.username] = pendingVotePayload.votos || {};
                    }
                    updateCategoryStyles();
                    displayCandidatas(candidatas);
                    loadRanking();
                }
            } catch (error) {
                console.log('Error cargando datos del servidor:', error);
                updateVotingStatusBanner('⚠️ No se pudo conectar al servidor. Los cambios pendientes se reintentará.', 'error');
                if (!candidatas.length) {
                    document.getElementById('candidatasGrid').innerHTML = '<p>No hay datos disponibles hasta que se restablezca la conexión.</p>';
                }
            }
        }

        function startServerPolling() {
            if (dataPollingTimer) return;
            loadServerData();
            dataPollingTimer = setInterval(loadServerData, 2000);
        }

        function stopServerPolling() {
            if (dataPollingTimer) {
                clearInterval(dataPollingTimer);
                dataPollingTimer = null;
            }
        }

        function slugify(text) {
            return String(text).toLowerCase().trim()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        function normalizeCategory(category) {
            if (!category) return null;
            if (typeof category === 'string') {
                return { name: category, color: '#ff6fe7', order: 999 };
            }
            if (typeof category === 'object' && category.name) {
                const order = Number(category.order);
                return {
                    name: String(category.name).trim(),
                    color: category.color || '#ff6fe7',
                    order: Number.isFinite(order) ? order : 999
                };
            }
            return null;
        }

        function normalizeCategories(raw) {
            if (!Array.isArray(raw)) return [];
            return raw
                .map(normalizeCategory)
                .filter(Boolean)
                .sort((a, b) => (Number(a.order || 0) - Number(b.order || 0)));
        }

        function updateCategoryStyles() {
            const styleEl = document.getElementById('categoryStyles');
            if (!styleEl) return;
            const styles = categorias.map(cat => {
                const selector = slugify(cat.name);
                return `.${selector} > h3 { color: ${cat.color}; outline: 1px solid ${cat.color}; box-shadow: 0 0 10px ${cat.color}; width: 100%; height: auto; border-radius: 5px; padding: 5px; }`;
            }).join('\n');
            styleEl.textContent = styles;
        }

        function loadRanking() {
            const userVotes = votos[currentUser.username] || {};
            let html = '';
            const orderedCategories = [...(categorias.length ? categorias : defaultCategorias)].sort((a, b) => (Number(a.order || 0) - Number(b.order || 0)));

            if (votingMode === 'scoring') {
                orderedCategories.forEach((cat, index) => {
                    const className = slugify(cat.name);
                    const voteEntry = Object.entries(userVotes).find(([candId, voteData]) => {
                        const candidate = candidatas.find(c => String(c.id) === String(candId));
                        if (!candidate) return false;
                        const scores = voteData?.scores || {};
                        return scores[cat.name] && Number(scores[cat.name]) > 0;
                    });

                    const displayCard = voteEntry ? candidatas.find(c => String(c.id) === String(voteEntry[0])) : null;
                    const totalScore = displayCard ? Object.values(userVotes[String(displayCard.id)]?.scores || {}).reduce((sum, score) => sum + clampScore(score), 0) : 0;

                    html += `<div class="${className}"><h3>${cat.name} <span style="font-size:0.72rem; opacity:0.7;">(puesto ${index + 1})</span></h3>`;
                    if (displayCard && totalScore > 0) {
                        html += `
                            <div class="candidata-card" onclick="showDetails(${displayCard.id})">
                                <img src="${displayCard.foto || 'img/default.jpg'}" alt="${displayCard.nombre}">
                                <h3>${displayCard.nombre}</h3>
                                <p>Candidata: <b>${displayCard.numero}</b></p>
                                <p><strong>${totalScore} puntos</strong></p>
                            </div>
                        `;
                    } else {
                        html += `<p>No has puntuado en este puesto</p>`;
                    }
                    html += '</div>';
                });
            } else {
                orderedCategories.forEach((cat, index) => {
                    const className = slugify(cat.name);
                    const votedId = userVotes[cat.name];
                    const displayCard = votedId ? candidatas.find(c => String(c.id) === String(votedId)) : null;

                    html += `<div class="${className}"><h3>${cat.name} <span style="font-size:0.72rem; opacity:0.7;">(puesto ${index + 1})</span></h3>`;
                    if (displayCard) {
                        html += `
                            <div class="candidata-card" onclick="showDetails(${displayCard.id})">
                                <img src="${displayCard.foto || 'img/default.jpg'}" alt="${displayCard.nombre}">
                                <h3>${displayCard.nombre}</h3>
                                <p>Candidata: <b>${displayCard.numero}</b></p>
                            </div>
                        `;
                    } else {
                        html += `<p>No has votado en este puesto</p>`;
                    }
                    html += '</div>';
                });
            }

            document.getElementById('rankingContent').innerHTML = html;
        }

        function displayCandidatas(list) {
            let html = '';
            list.forEach(c => {
                html += `
                    <div class="candidata-card" onclick="showDetails(${c.id})">
                        <img src="${c.foto || 'img/default.jpg'}" alt="${c.nombre}">
                        <h3>${c.nombre}</h3>
                        <p>Candidata: <b>${c.numero}</b> </p>
                    </div>
                `;
            });
            document.getElementById('candidatasGrid').innerHTML = html;
        }

        function showDetails(id) {
            const c = candidatas.find(cand => cand.id == id);
            if (c) {
                let detailsHtml = `
                    <img src="${c.foto || 'img/default.jpg'}" alt="${c.nombre}" class="modal-photo">
                    <div class="modal-header">
                        <h2>${c.nombre}</h2>
                        <span class="candidate-number">${c.numero}</span>
                    </div>
                    <div class="modal-details">
                        <div class="details-left">
                            <h4>Descripción</h4>
                            <p>${c.descripcion}</p>
                        </div>
                        <div class="details-right">
                            <div><strong>Canción:</strong> ${c.cancion}</div>
                            <div><strong>Año:</strong> ${c.ano}</div>
                        </div>
                    </div>
                    <br>
                `;

                if (!votingEnabled) {
                    detailsHtml += `<p style="color:#f44336; font-weight:bold; margin-top:20px;">Las votaciones están bloqueadas. No se pueden cambiar votos en este momento.</p>`;
                    document.getElementById('candidataDetails').innerHTML = detailsHtml;
                    modal.style.display = 'block';
                    return;
                }

                if (votingMode === 'scoring') {
                    detailsHtml += `<div style="margin-top:12px; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,0.06); color:#fff; font-size:0.9rem;">
                        Asigna puntajes del 1 al 100 por categoría. Los valores se guardan sin borrar los anteriores.
                    </div><br>`;

                    const userVotes = votos[currentUser.username] || {};
                    const candidateVote = userVotes[String(id)] || {};
                    const existingScores = candidateVote.scores || {};

                    let optionsHtml = '';
                    votingCategories.forEach(cat => {
                        const currentScore = existingScores[cat.name] || '';
                        optionsHtml += `
                            <label style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;">
                                ${cat.name}
                                <input type="number" min="1" max="100" step="1" value="${currentScore}" data-category="${cat.name}" id="score-${slugify(cat.name)}-${id}">
                            </label>
                        `;
                    });

                    document.getElementById('candidataDetails').innerHTML = `
                        ${detailsHtml}
                        <form id="voteForm">
                            <div class="vote-options">
                                ${optionsHtml}
                            </div>
                            <div class="button-group">
                                <button type="submit">Actualizar puntajes</button>
                            </div>
                        </form>
                    `;
                    modal.style.display = 'block';
                    document.getElementById('voteForm').addEventListener('submit', (e) => {
                        e.preventDefault();
                        votarPuntaje(id);
                    });
                } else {
                    // Modo votación directa
                    detailsHtml += `<div style="margin-top:12px; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,0.06); color:#fff; font-size:0.9rem;">
                        Elige un puesto para esta candidata.
                    </div><br>`;

                    const categories = [...(categorias.length ? categorias : defaultCategorias)].sort((a, b) => (Number(a.order || 0) - Number(b.order || 0)));
                    const userVotes = votos[currentUser.username] || {};

                    let votedCategory = null;
                    for (const [cat, votedId] of Object.entries(userVotes)) {
                        if (votedId == id) {
                            votedCategory = cat;
                            break;
                        }
                    }

                    let optionsHtml = '';
                    categories.forEach(cat => {
                        optionsHtml += `<label>${cat.name} <input type="radio" name="categoria" value="${cat.name}" ${votedCategory === cat.name ? 'checked' : ''}></label>`;
                    });

                    document.getElementById('candidataDetails').innerHTML = `
                        ${detailsHtml}
                        <form id="voteForm">
                            <div class="vote-options">
                                ${optionsHtml}
                            </div>
                            <div class="button-group">
                                <button type="submit">Votar</button>
                                ${votedCategory ? `<button type="button" id="deleteVoteBtn">Eliminar voto</button>` : ''}
                            </div>
                        </form>
                    `;
                    modal.style.display = 'block';
                    document.getElementById('voteForm').addEventListener('submit', (e) => {
                        e.preventDefault();
                        const categoria = document.querySelector('input[name="categoria"]:checked');
                        if (categoria) {
                            votarDirecto(id, categoria.value);
                        }
                    });

                    const deleteBtn = document.getElementById('deleteVoteBtn');
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            eliminarVoto(votedCategory);
                        });
                    }
                }
            }
        }

        function votarPuntaje(candId) {
            if (!votos[currentUser.username]) votos[currentUser.username] = {};

            const userVotes = votos[currentUser.username];
            const newScores = {};

            votingCategories.forEach(cat => {
                const input = document.getElementById(`score-${slugify(cat.name)}-${candId}`);
                if (!input) return;

                const score = clampScore(input.value);
                if (score > 0) {
                    newScores[cat.name] = score;
                }
            });

            userVotes[String(candId)] = {
                ...(userVotes[String(candId)] || {}),
                scores: {
                    ...(userVotes[String(candId)]?.scores || {}),
                    ...newScores,
                }
            };

            queueVotePayload({
                username: currentUser.username,
                votos: { [currentUser.username]: { ...userVotes } }
            });
            loadRanking();
            modal.style.display = 'none';
        }

        function votarDirecto(candId, categoria) {
            if (!votos[currentUser.username]) votos[currentUser.username] = {};
            const userVotes = votos[currentUser.username];

            // Cada categoría/puesto es independiente. Solo se sobrescribe el voto de esa categoría.
            userVotes[categoria] = candId;
            queueVotePayload({
                username: currentUser.username,
                votos: { [currentUser.username]: { ...userVotes } }
            });
            loadRanking();
            modal.style.display = 'none';
        }

        function votar(candId) {
            if (votingMode === 'scoring') {
                votarPuntaje(candId);
            } else {
                // No se debe llamar sin categoría en modo directo
                console.warn('Llame a votarDirecto o votarPuntaje según el modo');
            }
        }

        function eliminarVoto(categoria) {
            if (!votos[currentUser.username]) return;
            delete votos[currentUser.username][categoria];

            queueVotePayload({
                username: currentUser.username,
                votos: { [currentUser.username]: { ...votos[currentUser.username] } }
            });
            loadRanking();
            modal.style.display = 'none';
        }

        function initVoting() {
            currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'index.html';
                return;
            }

            candidatas = [];
            votos = {};
            categorias = [];
            votingMode = 'direct';
            votingCategories = [];

            loadServerData();
            startServerPolling();
            updateVotingModeUI();

            checkVotingStatus();
            startVotingStatusPolling();

            if (window.innerWidth <= 768) {
                initCarousel();
            }

            document.getElementById('search').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = candidatas.filter(c =>
                    c.nombre.toLowerCase().includes(query) ||
                    c.numero.toString().includes(query)
                );
                displayCandidatas(filtered);
            });

            modal = document.getElementById('modal');
            const closeBtn = document.getElementsByClassName('close')[0];

            closeBtn.onclick = () => modal.style.display = 'none';
            window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };
        }

        function updateVotingModeUI() {
            const modeMessage = votingMode === 'scoring' 
                ? '🎯 Modo: Votación por Puntaje (1-100)' 
                : '✓ Modo: Votación Directa';
            updateVotingStatusBanner(modeMessage, votingMode === 'scoring' ? 'info' : 'success');
        }

        let votingStatusInterval; // Para guardar el intervalo

        async function checkVotingStatus() {
            try {
                const response = await fetch('/api/get-voting-status');
                const data = await response.json();
                const wasEnabled = votingEnabled;
                votingEnabled = data.voting_enabled;
                
                const banner = document.getElementById('votingStatusBanner');
                if (votingEnabled) {
                    banner.textContent = '✅ Votaciones activas';
                    banner.style.backgroundColor = '#d4edda';
                    banner.style.color = '#155724';
                    banner.style.border = '2px solid #28a745';
                    banner.style.display = 'block';
                } else {
                    banner.textContent = '🚫 Votaciones bloqueadas - No se pueden cambiar votos en este momento';
                    banner.style.backgroundColor = '#f8d7da';
                    banner.style.color = '#721c24';
                    banner.style.border = '2px solid #f5c6cb';
                    banner.style.display = 'block';
                }
                
                // Detectar cambio de estado y mostrar alerta
                if (wasEnabled !== votingEnabled) {
                    if (!votingEnabled) {
                        console.log('Las votaciones han sido bloqueadas');
                    } else {
                        console.log('Las votaciones han sido reactivadas');
                    }
                }
            } catch (error) {
                console.log('Error obteniendo estado de votación:', error);
            }
        }

        function startVotingStatusPolling() {
            // Verificar estado cada 2 segundos para actualización en vivo
            checkVotingStatus();
            votingStatusInterval = setInterval(checkVotingStatus, 2000);
        }

        function stopVotingStatusPolling() {
            if (votingStatusInterval) {
                clearInterval(votingStatusInterval);
            }
        }

        document.getElementById('logout').addEventListener('click', async () => {
            stopVotingStatusPolling();
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            try {
                await fetch('/api/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: currentUser.username
                    })
                });
            } catch (error) {
                console.log('Error al cerrar sesión:', error);
            }
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        });

        function initCarousel() {
            const container = document.getElementById('rankingContent');
            const items = container.children;
            let currentIndex = 0;
            setInterval(() => {
                currentIndex = (currentIndex + 1) % items.length;
                container.style.transform = `translateX(-${currentIndex * 100}%)`;
            }, 3000);
        }
    </script>
</body>
</html>
